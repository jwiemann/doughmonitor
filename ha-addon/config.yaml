name: Sourdough Monitor
url: https://github.com/jwiemann/doughmonitor
version: "0.2.2"
slug: sourdough_monitor
description: Monitor sourdough rise from Frigate camera snapshots with MQTT discovery
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true
services:
  - mqtt:need
map:
  - share:rw
options:
  frigate_camera: "battery_cam"
  frigate_sample_interval_minutes: 5
  frigate_base_url: ""
  frigate_snapshot_url: ""
  frigate_snapshot_quality: 75
  frigate_snapshot_height: 720
  mqtt_device_id: "sourdough_monitor"
  debug_enabled: false
  snapshot_archive_directory: ""
  debug_highlight_dough: false
  llm_api_key: ""
  llm_model: "google/gemini-3.8-flash"
  llm_max_calls_per_day: 4500
  llm_samples_per_cycle: 3
schema:
  frigate_camera: str
  frigate_sample_interval_minutes: float(0.25,60)
  frigate_base_url: str?
  frigate_snapshot_url: str?
  frigate_snapshot_quality: int(30,95)
  frigate_snapshot_height: int(240,2160)
  mqtt_device_id: str
  debug_enabled: bool
  snapshot_archive_directory: str?
  debug_highlight_dough: bool
  llm_api_key: password
  llm_model: str
  llm_max_calls_per_day: int(1,100000)
  llm_samples_per_cycle: int(1,9)
